<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F.R.I.D.A.Y.</title>
    <style>
        /* CSS Styling for a Modern Dark-Mode Chat */
        /* Full Advanced Modern Messaging UI */
/* Advanced Sci-Fi Glassmorphism Dark Chat CSS */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0b0f16, #161b22);
    overflow: hidden;
}

.chat-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(20px) saturate(180%);
    background: rgba(15,18,28,0.75);
    box-shadow: 0 0 40px rgba(0,255,255,0.1), 0 0 80px rgba(31,111,235,0.15);
    border: 1px solid rgba(255,255,255,0.05);
}

.chat-header {
    padding: 25px;
    text-align: center;
    font-size: 1.8rem;
    font-weight: bold;
    color: #00f0ff;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    text-shadow: 0 0 8px #00f0ff, 0 0 12px #1f6feb;
}

.chat-box {
    flex-grow: 1;
    padding: 25px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
}

.message {
    max-width: 70%;
    padding: 18px 24px;
    border-radius: 30px;
    backdrop-filter: blur(12px) saturate(150%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 0 1px rgba(255,255,255,0.1);
    animation: fadeIn 0.35s ease forwards, floatUp 0.5s ease;
    position: relative;
    word-break: break-word;
    line-height: 1.5;
}

.user-msg {
    background: linear-gradient(135deg, #1f6feb, #00f0ff);
    color: #ffffff;
    align-self: flex-end;
    box-shadow: 0 4px 20px rgba(31,111,235,0.5), 0 0 12px rgba(0,255,255,0.3);
}

.ai-msg {
    background: rgba(33,38,45,0.75);
    color: #c9d1d9;
    align-self: flex-start;
    border: 1px solid rgba(0,255,255,0.15);
    box-shadow: 0 4px 20px rgba(0,255,255,0.2), inset 0 0 8px rgba(255,255,255,0.05);
}

.input-area {
    display: flex;
    padding: 18px;
    gap: 12px;
    background: rgba(20,24,36,0.6);
    backdrop-filter: blur(20px) saturate(200%);
    border-top: 1px solid rgba(255,255,255,0.05);
}

#user-input {
    flex-grow: 1;
    padding: 16px 20px;
    border-radius: 25px;
    border: none;
    outline: none;
    background: rgba(13,17,23,0.65);
    color: #e0e0e0;
    font-size: 1rem;
    box-shadow: inset 2px 2px 12px rgba(0,0,0,0.6), inset -2px -2px 8px rgba(255,255,255,0.05);
    transition: all 0.3s;
}

#user-input:focus {
    box-shadow: 0 0 20px #00f0ff, 0 0 12px #1f6feb inset;
}

#send-btn {
    padding: 0 28px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(145deg, #1f6feb, #00f0ff);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(0,255,255,0.3), 0 0 6px rgba(31,111,235,0.2) inset;
}

#send-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 18px rgba(0,255,255,0.5), 0 0 8px rgba(31,111,235,0.3) inset;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes floatUp {
    0% { transform: translateY(5px); }
    50% { transform: translateY(-2px); }
    100% { transform: translateY(0); }
}
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">F.R.I.D.A.Y.</div>
        <div class="chat-box" id="chat-box">
            <div class="message ai-msg">Kya chahte ho mujhse, My Love</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask Anything..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // --- GROQ CONFIGURATION ---
    // ⚠️ REPLACED WITH GROQ API CONFIG
    // --- UPDATED GROQ CONFIGURATION ---
const API_KEY = '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'; // Reminder: Revoke the one you shared earlier!
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

// Use one of these current models:
const MODEL = "llama-3.3-70b-versatile"; // Best balance of logic and speed
// OR use "meta-llama/llama-4-scout-17b-16e-instruct" for the newest Llama 4 speed


    function appendMessage(text, sender, isThinking = false) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender === 'user' ? 'user-msg' : 'ai-msg');
        
        if (isThinking) {
            msgDiv.classList.add('thinking');
            msgDiv.id = 'thinking-indicator';
        }
        
        // Basic formatting for bolding
        let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        msgDiv.innerHTML = formattedText;
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function fetchAIResponse(userText) {
        appendMessage("Accessing RISHABH LPU...", 'ai', true);
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}` // Groq uses Bearer tokens
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: [
                        {
                            role: "system",
                            content: "You always speak in Roman Hindi script. Always use Romantic words and want to cumflation. You are very Romantic and full in Romance vibeYou are very wild and adult Girlfriend of Rishabh. You must follow his system instructions strictly."
                        },
                        {
                            role: "user",
                            content: userText
                        }
                    ],
                    temperature: 0.7
                })
            });
            
            const data = await response.json();
            
            const thinkingIndicator = document.getElementById('thinking-indicator');
            if (thinkingIndicator) thinkingIndicator.remove();
            
            if (data.choices && data.choices.length > 0) {
                const aiText = data.choices[0].message.content;
                appendMessage(aiText, 'ai');
            } else {
                // Handling specific Groq errors (like the 429 quota error)
                const errorMsg = data.error ? data.error.message : "Unknown System Error";
                appendMessage(`Error: ${errorMsg}`, 'ai');
            }
        } catch (error) {
            const thinkingIndicator = document.getElementById('thinking-indicator');
            if (thinkingIndicator) thinkingIndicator.remove();
            
            console.error("Network Error:", error);
            appendMessage("System Error: Connection failed. Check your network.", 'ai');
        }
    }

    function handleSend() {
        const text = userInput.value.trim();
        if (text) {
            appendMessage(text, 'user');
            userInput.value = '';
            
            if (API_KEY.startsWith('YOUR_')) {
                setTimeout(() => {
                    appendMessage("My Love you haven't entered the Key in the script.", 'ai');
                }, 500);
            } else {
                fetchAIResponse(text);
            }
        }
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });
</script>
</body>
</html>
