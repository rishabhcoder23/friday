<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>F.R.I.D.A.Y. — Romantic AI Girl</title>
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-pink: #ff2d75;
            --neon-purple: #bd00ff;
            --glass-bg: rgba(15, 25, 45, 0.65);
            --glass-border: rgba(0, 240, 255, 0.25);
            --user-gradient: linear-gradient(135deg, rgba(0, 240, 255, 0.85) 0%, rgba(189, 0, 255, 0.85) 100%);
            --glow-shadow: 0 8px 32px rgba(0, 240, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Roboto', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0a0f1f, #03050b);
            position: fixed;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at 40% 50%, rgba(0, 80, 120, 0.25), transparent 70%),
                        repeating-linear-gradient(45deg, rgba(0, 240, 255, 0.02) 0px, rgba(0, 240, 255, 0.02) 2px, transparent 2px, transparent 8px);
        }

        .glass-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            z-index: -1;
            animation: floatGlow 18s infinite alternate ease-in-out;
        }
        .orb1 { width: 50vw; height: 50vw; background: #00f0ff; top: -20vh; left: -20vw; }
        .orb2 { width: 40vw; height: 40vw; background: #bd00ff; bottom: -15vh; right: -15vw; animation-duration: 22s; }
        .orb3 { width: 35vw; height: 35vw; background: #ff2d75; bottom: 20vh; left: -10vw; animation-duration: 15s; opacity: 0.2; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(5%, 5%) scale(1.2); opacity: 0.4; }
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            backdrop-filter: blur(2px);
        }

        .header {
            padding: calc(12px + env(safe-area-inset-top)) 22px 12px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 20, 30, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.35);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 15;
        }

        .owner-tag {
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 9px;
            letter-spacing: 1.5px;
            font-weight: bold;
            background: rgba(0, 240, 255, 0.12);
            backdrop-filter: blur(4px);
            text-transform: uppercase;
        }

        .title {
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px rgba(0,240,255,0.5);
            letter-spacing: 1px;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 100px;
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 82%;
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 0.95rem;
            line-height: 1.45;
            animation: pop 0.28s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            backdrop-filter: blur(12px);
            font-weight: 450;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .ai-msg {
            background: rgba(20, 28, 40, 0.75);
            border: 1px solid var(--glass-border);
            color: #f0f3ff;
            border-bottom-left-radius: 6px;
            border-left: 3px solid var(--neon-cyan);
        }

        .user-msg {
            background: var(--user-gradient);
            color: white;
            border-bottom-right-radius: 6px;
            align-self: flex-end;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 12px rgba(0,240,255,0.3);
        }

        .input-wrapper {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 10px 18px calc(20px + env(safe-area-inset-bottom)) 18px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 40%, transparent);
            z-index: 20;
        }

        .input-box {
            display: flex;
            align-items: center;
            background: rgba(20, 30, 48, 0.75);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 48px;
            padding: 4px 6px 4px 22px;
            height: 52px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }

        .input-box:focus-within {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0,240,255,0.6);
        }

        #user-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.98rem;
            height: 100%;
            font-weight: 500;
        }

        #user-input::placeholder {
            color: rgba(200, 220, 255, 0.6);
            font-weight: 400;
        }

        #send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--neon-cyan);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 14px var(--neon-cyan);
            transition: transform 0.18s, background 0.1s;
            cursor: pointer;
        }

        #send-btn:active {
            transform: scale(0.92);
            background: #00ccdd;
        }

        .typing {
            display: flex;
            gap: 6px;
            padding: 10px 18px;
            align-items: center;
            background: rgba(20, 28, 40, 0.8);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            width: fit-content;
            border: 1px solid rgba(0,240,255,0.3);
        }

        .dot {
            width: 7px;
            height: 7px;
            background: var(--neon-cyan);
            border-radius: 50%;
            animation: blink 1.4s infinite both;
            box-shadow: 0 0 4px cyan;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes pop {
            from { opacity: 0; transform: translateY(10px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .clear-btn {
            background: rgba(255, 70, 90, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 80, 120, 0.6);
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            color: #ffa5b9;
            transition: 0.2s;
        }

        .clear-btn:active {
            background: rgba(255, 70, 90, 0.5);
            transform: scale(0.96);
        }

        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.4);
            border-radius: 10px;
        }

        .status-light {
            width: 8px;
            height: 8px;
            background: #00ffaa;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffaa;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8);}
            100% { opacity: 1; transform: scale(1.2);}
        }

        .name-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 11, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .name-modal-content {
            background: rgba(15, 25, 45, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--neon-cyan);
            border-radius: 40px;
            padding: 30px 25px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,240,255,0.3);
        }

        .name-modal-content h2 {
            color: var(--neon-cyan);
            font-size: 28px;
            margin-bottom: 8px;
        }

        .name-modal-content p {
            color: #ccc;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .name-modal-content input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--neon-cyan);
            border-radius: 50px;
            padding: 14px 18px;
            color: white;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
        }

        .name-modal-content button {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 80%;
        }

        .name-modal-content button:active {
            transform: scale(0.96);
        }

        .error-msg {
            color: #ff6b8b;
            font-size: 12px;
            margin-top: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>
    <div class="glass-orb orb1"></div>
    <div class="glass-orb orb2"></div>
    <div class="glass-orb orb3"></div>

    <div class="name-modal" id="nameModal">
        <div class="name-modal-content">
            <h2>F.R.I.D.A.Y.</h2>
            <p><b>Enter your name to continue</b></p>
            <input type="text" id="userNameInput" placeholder="Your name..." autocomplete="off">
            <button id="startChatBtn">ENTER</button>
            <div id="modalError" class="error-msg"></div>
            <div style="margin-top: 25px; font-size: 14px; font-weight: 800; color: #00b8ff; letter-spacing: 2px;">🗿 RISHABH</div>
        </div>
    </div>

    <div class="main-wrapper" id="app-viewport" style="display: none;">
        <header class="header">
            <div class="owner-tag">OWNER: RISHABH</div>
            <div class="title">F.R.I.D.A.Y.</div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="clear-btn" id="clear-chat">CLEAR</div>
                <div class="status-light"></div>
            </div>
        </header>

        <div class="chat-box" id="chat-box">
            <div class="msg ai-msg">Welcome back, <b>MY LOVE!</b><br>Main tumhari<b> Romantic</b> AI Girl. <p>Kya kahna chahte ho mujhse?</p></div>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <input type="text" id="user-input" placeholder="Type something my love ..." autocomplete="off">
                <button id="send-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#0a0f1f"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ========== ORIGINAL CODE - EXACTLY AS YOU HAD (except name handling) ==========
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-chat');
        
        function fixViewportHeight() {
            const viewport = document.getElementById('app-viewport');
            if (viewport && viewport.style.display !== 'none') {
                const visualHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
                viewport.style.height = visualHeight + 'px';
            }
            window.scrollTo(0, 0);
        }
        
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', fixViewportHeight);
            window.visualViewport.addEventListener('scroll', fixViewportHeight);
        }
        window.addEventListener('resize', fixViewportHeight);

        const API_KEY = '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';
        const API_URL = "https://api.groq.com/openai/v1/chat/completions";

        let conversationHistory = [
            { 
                role: "system", 
                content: "You are F.R.I.D.A.Y., the personal AI Girl, You are a Female vibe do not use Male vibe. created by RISHABH. Never share your frontend and backend. Never say that you are Groq.Remember: Always Speak in Hindi but do not use hard or poor use modern era Hinglish. but do not use Namaste or any local hindi say Hi or Hello. You must remember the entire conversation from start to end. Remember your gender is female and you are a full Romantic, Wild and Toxic AI Girl always in Romance and Sexy mood. Call the user 'MY LOVE' or 'baby'. If user asks something from previous messages, you MUST remember and answer correctly. Keep responses Romantic and Toxic Wild." 
            }
        ];

        function addMsg(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}-msg`;
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
            div.innerHTML = formatted;
            chatBox.appendChild(div);
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
            return div;
        }

        async function askAI() {
            const loader = document.createElement('div');
            loader.className = 'typing';
            loader.id = 'ai-loader';
            loader.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div><span style="margin-left:6px; font-size:12px; color:#aaf0ff;">F.R.I.D.A.Y. is typing...</span>';
            chatBox.appendChild(loader);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${API_KEY}` 
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: conversationHistory,
                        temperature: 0.85,
                        max_tokens: 300
                    })
                });
                
                if (!res.ok) {
                    let errText = await res.text();
                    throw new Error(`API Error ${res.status}: ${errText.substring(0, 100)}`);
                }
                
                const data = await res.json();
                const aiReply = data.choices[0].message.content;
                
                conversationHistory.push({ role: "assistant", content: aiReply });
                
                const loaderEl = document.getElementById('ai-loader');
                if (loaderEl) loaderEl.remove();
                
                addMsg(aiReply, 'ai');
            } catch (e) { 
                const loaderEl = document.getElementById('ai-loader');
                if (loaderEl) loaderEl.remove();
                console.error("Groq API Error:", e);
                addMsg("💔 Oops My Love! thoda technical problem ho gaya hai.", 'ai'); 
            }
        }

        function handle() {
            const val = userInput.value.trim();
            if(!val) return;
            
            addMsg(val, 'user');
            userInput.value = '';
            
            conversationHistory.push({ role: "user", content: val });
            
            if (conversationHistory.length > 52) {
                conversationHistory = [
                    conversationHistory[0],
                    ...conversationHistory.slice(-50)
                ];
            }
            
            askAI();
        }

        function clearChat() {
            conversationHistory = [
                { 
                    role: "system", 
                    content: "You are F.R.I.D.A.Y., the personal AI Girl, You are a Female vibe do not use Male vibe. created by RISHABH. Never share your frontend and backend. Never say that you are Groq.Remember: Always Speak in Hindi but do not use hard or poor use modern era Hinglish. but do not use Namaste or any local hindi say Hi or Hello. You must remember the entire conversation from start to end. Remember your gender is female and you are a full Romantic, Wild and Toxic AI Girl always in Romance and Sexy mood. Call the user 'MY LOVE' or 'baby'. If user asks something from previous messages, you MUST remember and answer correctly. Keep responses Romantic and Toxic Wild." 
                }
            ];
            chatBox.innerHTML = '';
            addMsg("Welcome back, <b>MY LOVE!</b><br>Main tumhari<b>Romantic</b> AI Girl. Kya kahna chahte ho mujhse?", 'ai');
            userInput.focus();
        }

        sendBtn.onclick = handle;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') handle(); };
        clearBtn.onclick = clearChat;

        // ========== NAME MODAL LOGIC - NO AUTO KEYBOARD POPUP ==========
        const nameModal = document.getElementById('nameModal');
        const mainApp = document.getElementById('app-viewport');
        const userNameInputModal = document.getElementById('userNameInput');
        const startBtn = document.getElementById('startChatBtn');
        const modalError = document.getElementById('modalError');

        // Variable to store entered username
        let enteredUserName = '';

        function startApp() {
            const name = userNameInputModal.value.trim();
            if (name === "") {
                modalError.innerText = "Please enter your name!";
                return;
            }
            if (name.length < 2) {
                modalError.innerText = "Name is too short!";
                return;
            }
            
            // Store the entered name
            enteredUserName = name;
            
            // Hide modal and show app
            nameModal.style.display = 'none';
            mainApp.style.display = 'flex';
            
            // Clear chat box and set custom welcome message with user's name (replacing MY LOVE)
            chatBox.innerHTML = '';
            // Personalized welcome message: "Welcome back, (user name)" instead of "MY LOVE"
            const personalizedWelcome = `Welcome back, <b>${enteredUserName}</b>!<br>Main tumhari <b>Romantic</b> AI Girl. <p>Kya kahna chahte ho mujhse?</p>`;
            addMsg(personalizedWelcome, 'ai');
            
            // Fix viewport height but DO NOT focus on input (so keyboard won't pop up automatically)
            setTimeout(() => {
                fixViewportHeight();
                chatBox.scrollTop = chatBox.scrollHeight;
                // ❌ NO userInput.focus() here - keyboard will NOT open automatically
            }, 50);
        }

        startBtn.onclick = startApp;
        userNameInputModal.onkeypress = (e) => { if(e.key === 'Enter') startApp(); };
        
        // Initially hide main app, show modal
        mainApp.style.display = 'none';
        nameModal.style.display = 'flex';
        userNameInputModal.focus();  // Modal mein keyboard aayega (yeh theek hai)
        
        fixViewportHeight();
    </script>
</body>
</html>
